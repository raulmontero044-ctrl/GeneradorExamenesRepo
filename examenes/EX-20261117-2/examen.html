<script type="application/json" id="datos">{"examen":{"id":"EX-20261117-2","fechaCreacion":"2026-11-17T15:29:35.131Z"},"temas":{"prog-08":{"titulo":"08 - Arquitectura de Software por Capas y Diseño de Componentes","asignaturaNombre":"Programación"},"prog-09":{"titulo":"09. APIs REST y Protocolo HTTP","asignaturaNombre":"Programación"},"prog-10":{"titulo":"10. Frameworks Web: Spring Boot","asignaturaNombre":"Programación"},"prog-12":{"titulo":"12 - Login con tokens","asignaturaNombre":"Programación"},"dws-01":{"titulo":"01 - Arquitecturas de software","asignaturaNombre":"Desarrollo Web en Entorno Servidor"},"dws-02":{"titulo":"02 - API First","asignaturaNombre":"Desarrollo Web en Entorno Servidor"},"dws-03":{"titulo":"03 - Validación e invariancias","asignaturaNombre":"Desarrollo Web en Entorno Servidor"},"dws-04":{"titulo":"04 - Monolito modular","asignaturaNombre":"Desarrollo Web en Entorno Servidor"}},"preguntas":[{"id":"prog-08-5e90aa71","asignatura":"prog","tema":"prog-08","enunciado":"Según el ejemplo BookMapper del tema, ¿qué describe correctamente cómo trabaja el mapeador al convertir entre BookCreateRequest, Book y BookResponse?","opciones":{"A":"toDomain crea el Book asignándole un ID provisional, ya que BookCreateRequest no lo incluye; ambos métodos lanzan una excepción si reciben null en lugar de un objeto.","B":"toDomain lee el record con sus accesores sin prefijo get (como dto.isbn()); toResponse calcula el precio final dentro del propio mapeador a partir de basePrice, para que la regla quede en la frontera entre presentación y dominio.","C":"El mapeador trabaja en la frontera entre dominio y persistencia: toDomain convierte el BookCreateRequest en una BookEntity y toResponse convierte esa BookEntity en un BookResponse.","D":"toDomain lee el record con sus accesores sin prefijo get (como dto.isbn()); toResponse usa los getters de la entidad Book y es la llamada a getFinalPrice() la que aplica el cálculo del dominio; ambos devuelven null si reciben null."},"correcta":"D","explicacionCorrecta":"La wiki indica que toDomain crea un Book con dto.isbn(), dto.title() y dto.basePrice() (accesores propios del record, sin get), que toResponse construye el BookResponse con los getters de la entidad (domain.getIsbn(), domain.getFinalPrice()) y que la llamada a getFinalPrice() es donde se aplica la regla o cálculo del dominio. Ambos métodos devuelven null si reciben null.","explicacionesDistractores":{"A":"toDomain solo usa isbn, title y basePrice; el ID lo asigna el sistema y el mapper no lo inventa. Además, ambos métodos devuelven null cuando reciben null, no lanzan una excepción.","B":"El mapeador no calcula el precio: según la wiki, la regla se aplica al llamar a getFinalPrice() de la entidad Book, es decir, en el dominio. El mapper solo convierte un tipo en otro.","C":"La wiki sitúa la conversión al cruzar la frontera entre la capa de presentación y la de dominio, entre DTO y entidad de dominio (Book), no entre dominio y persistencia ni con BookEntity."},"dificultad":"dificil","tipo":"funcionamiento-interno","wikiRef":[{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Conversión entre objetos: Mapeadores (Mappers)"}]},{"id":"prog-08-742ab333","asignatura":"prog","tema":"prog-08","enunciado":"Para ahorrarse una llamada, un desarrollador hace que BookController invoque directamente a BookDaoImpl para leer los libros, sin pasar por BookService ni por BookRepository. Según las reglas de comunicación entre capas del tema, ¿qué ocurre con este diseño?","opciones":{"A":"Es válido, porque la llamada sigue yendo hacia abajo y el flujo unidireccional solo prohíbe que una capa llame a las capas superiores.","B":"Incumple la regla de aislamiento, porque al recibir la llamada el DAO pasa a conocer al controlador que lo invoca.","C":"Incumple la prohibición del salto de capas: el controlador nunca debe comunicarse directamente con la persistencia, sino a través de la capa de dominio.","D":"Solo sería incorrecto si el controlador usara la clase BookDaoImpl; invocando la interfaz BookDao se respetarían las reglas de comunicación."},"correcta":"C","explicacionCorrecta":"Entre las reglas de comunicación, la wiki establece «Prohibido el salto de capas: el controlador nunca debe comunicarse directamente con la capa de persistencia». Las llamadas deben seguir Controller → Service → Repository, y el diagrama subraya que el controlador no salta a la persistencia.","explicacionesDistractores":{"A":"Que la llamada vaya hacia abajo no basta: además del flujo unidireccional, la wiki prohíbe expresamente el salto de capas, que es justo lo que hace el controlador al llamar al DAO.","B":"La regla de aislamiento dice que una capa inferior nunca debe conocer ni llamar a las superiores; aquí el DAO no llama al controlador ni depende de él. La regla incumplida es la del salto de capas.","D":"Depender de interfaces no autoriza el salto: la wiki prohíbe que el controlador se comunique directamente con la persistencia, sea a través de una interfaz o de su implementación."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Reglas de Comunicación entre Capas"}]},{"id":"prog-08-9a0a1406","asignatura":"prog","tema":"prog-08","enunciado":"En el ejemplo de libros del tema aparecen tres clases que representan un libro: Book, BookEntity y BookResponse. Según el diagrama de componentes y el mapper descritos en la wiki, ¿qué afirmación diferencia correctamente su papel?","opciones":{"A":"Book es la entidad de dominio que utiliza BookServiceImpl; BookEntity pertenece a la persistencia y la utiliza BookDaoImpl; BookResponse es un DTO de salida que utiliza BookController.","B":"Book y BookResponse son records con accesores sin prefijo get, mientras que BookEntity es la única de las tres que es una clase convencional con getters.","C":"BookController devuelve directamente la entidad Book al exterior y emplea BookResponse únicamente como DTO de entrada para recibir los datos.","D":"BookEntity es la entidad de dominio que utiliza BookServiceImpl, mientras que Book es la clase con la que BookDaoImpl lee y escribe en la base de datos o fichero."},"correcta":"A","explicacionCorrecta":"El diagrama sitúa la entidad Book en la capa de dominio, utilizada por BookServiceImpl; BookEntity en la capa de persistencia, utilizada por BookDaoImpl; y BookResponse en la capa de presentación como DTO de salida que utiliza BookController. El mapper toResponse convierte Book en BookResponse.","explicacionesDistractores":{"B":"La wiki indica que la entidad Book es una clase convencional con getters (getIsbn()), mientras que los DTO, como BookResponse, son records con accesores como isbn().","C":"La wiki desaconseja exponer directamente las entidades del dominio; BookResponse es el DTO de salida (con el precio final calculado), no de entrada. El de entrada es el Request DTO.","D":"Invierte los papeles: según el diagrama, BookServiceImpl utiliza la entidad de dominio Book y es BookDaoImpl quien utiliza BookEntity y lee/escribe en la base de datos o fichero."},"dificultad":"dificil","tipo":"diferencias","wikiRef":[{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Diagrama de componentes del ejemplo (libros)"},{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Conversión entre objetos: Mapeadores (Mappers)"}]},{"id":"prog-08-4e750deb","asignatura":"prog","tema":"prog-08","enunciado":"Un equipo quiere probar la lógica de negocio de BookServiceImpl sin ejecutar la base de datos real, pero el constructor de BookServiceImpl crea internamente su repositorio con new. Según el tema, ¿qué cambio permite hacer esa prueba aislada?","opciones":{"A":"Declarar el repositorio como atributo static para poder sustituirlo desde la prueba, manteniendo su creación con new dentro del constructor.","B":"Cambiar el new del constructor para que el repositorio use BookDaoJson, ya que un fichero JSON no necesita base de datos y la prueba queda aislada.","C":"Que BookServiceImpl reciba la interfaz BookRepository por su constructor, para que la prueba pueda entregarle un objeto simulado (Mock) en lugar de la implementación real.","D":"Trasladar la lógica de negocio al controlador, que no accede a datos, y probarla allí sin necesidad de persistencia."},"correcta":"C","explicacionCorrecta":"La wiki señala que crear las dependencias con new impide las pruebas unitarias aisladas, y que con DI la clase recibe sus dependencias desde fuera. Entre las ventajas de IoC/DI cita la facilidad para pruebas unitarias: es posible pasar al constructor un objeto simulado (Mock) para probar la lógica de negocio aisladamente.","explicacionesDistractores":{"A":"Si la clase sigue creando su dependencia con new, sigue decidiendo internamente la implementación concreta, que es el error que la wiki señala. La solución que propone es recibir la dependencia por constructor, no un atributo static.","B":"Cambiar el new sigue obligando a modificar el código interno de la clase y la prueba seguiría ejecutando una implementación real de persistencia, no un Mock. Es el mismo acoplamiento que la wiki critica.","D":"La capa de presentación no debe contener lógica de negocio según la wiki; trasladarla rompería la arquitectura por capas en lugar de hacer el servicio testable."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Ventajas de IoC / DI"},{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"4. Gestión de Dependencias: DI e IoC"}]},{"id":"prog-08-c3aa7cae","asignatura":"prog","tema":"prog-08","enunciado":"Sobre las reglas de comunicación entre capas y el diagrama de componentes del ejemplo de libros, ¿cuál de las siguientes afirmaciones es INCORRECTA?","opciones":{"A":"BookServiceImpl consume BookRepository, accediendo a la capa de persistencia de nuevo a través de una interfaz.","B":"Una capa inferior nunca debe conocer ni llamar a las capas superiores, de modo que las llamadas siempre van hacia abajo.","C":"BookController consume directamente la implementación BookServiceImpl, ya que la capa de presentación debe conocer la clase concreta del dominio.","D":"En el diagrama, BookDaoImpl es el único componente que lee y escribe en la base de datos o fichero."},"correcta":"C","explicacionCorrecta":"Es falsa: en el diagrama BookController consume BookService, la interfaz del dominio, y no su implementación. Cada capa depende de la interfaz de la capa inmediatamente inferior.","explicacionesDistractores":{"A":"Es correcta: la relación 5 del diagrama indica que BookServiceImpl consume BookRepository, de nuevo a través de una interfaz.","B":"Es correcta: la regla de aislamiento dice que una capa inferior nunca debe conocer ni llamar a las superiores, y el flujo unidireccional que las llamadas van hacia abajo (Controller → Service → Repository).","D":"Es correcta: la wiki indica que solo el DAO toca el soporte físico; BookDaoImpl lee y escribe en la Base de Datos / Fichero."},"dificultad":"media","tipo":"afirmaciones","wikiRef":[{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Reglas de Comunicación entre Capas"},{"archivo":"wiki/programacion/tema-08-arquitectura/contenido.md","seccion":"Diagrama de componentes del ejemplo (libros)"}]},{"id":"prog-09-04a8aaf6","asignatura":"prog","tema":"prog-09","enunciado":"Un equipo propone dos endpoints: para crear un libro, POST /createBook?isbn=…&title=…&basePrice=…; para borrarlo, DELETE /books enviando {\"id\": 12} en el cuerpo de la petición. Según la wiki, ¿qué valoración es correcta?","opciones":{"A":"Solo el segundo incumple; POST /createBook es aceptable porque la acción queda clara en el método y en la URL, y POST admite los datos en Query Params.","B":"Solo el primero incumple, por el verbo en la URL; DELETE, igual que POST, PUT y PATCH, transmite sus datos en el cuerpo de la petición.","C":"Ambos incumplen la wiki: la creación debe ser POST /books con los datos en el cuerpo, y el borrado debe identificar el recurso con un Path Param, como DELETE /books/12.","D":"Ambos incumplen solo por el nombre del endpoint; con sustantivos en plural, POST podría enviar sus datos en Query Params y DELETE en el cuerpo."},"correcta":"C","explicacionCorrecta":"La wiki exige sustantivos en plural y no verbos (POST /createBook aparece como incorrecto), indica que POST lleva los datos en el cuerpo y que DELETE los lleva en la URL mediante un Path Param. Ambos diseños incumplen esas reglas.","explicacionesDistractores":{"A":"POST /createBook es justo el ejemplo incorrecto de la wiki, porque la acción la determina el método HTTP y no la URL; además, POST envía los datos en el cuerpo.","B":"Según la tabla de métodos, DELETE lleva los datos en la URL (Path Param); solo POST, PUT y PATCH los envían en el cuerpo.","D":"No es solo cuestión de nombres: la wiki establece dónde viajan los datos de cada método, cuerpo para POST y Path Param en la URL para DELETE."},"dificultad":"dificil","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"Buenas prácticas en el diseño de Endpoints"},{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"Matices que conviene retener"}]},{"id":"prog-09-3a6562a9","asignatura":"prog","tema":"prog-09","enunciado":"Un equipo necesita dos endpoints de lectura: uno para obtener los autores del libro con ID 12 y otro para listar los libros de la categoría fiction. Siguiendo las buenas prácticas de diseño de endpoints de la wiki, ¿qué pareja de peticiones es la adecuada?","opciones":{"A":"GET /books/12/authors para los autores y GET /books/category/fiction para el filtrado, anidando también la categoría en la ruta.","B":"GET /getAuthors/12 para los autores y GET /books?category=fiction para el filtrado, indicando en la ruta la acción que se realiza.","C":"GET /books/12/authors para los autores y GET /books?category=fiction para el filtrado por categoría mediante un Query Parameter.","D":"POST /books/12/authors para los autores y POST /books con la categoría en el cuerpo, para no exponer el criterio en la URL."},"correcta":"C","explicacionCorrecta":"La wiki recomienda anidar recursos para expresar relaciones jerárquicas (GET /books/12/authors obtiene los autores del libro 12) y filtrar y paginar mediante Query Parameters (GET /books?category=fiction&page=1).","explicacionesDistractores":{"A":"La anidación se reserva para relaciones jerárquicas; para filtrar, la buena práctica de la wiki es usar Query Parameters, no segmentos de la ruta.","B":"La wiki exige sustantivos en plural y nunca verbos en la URL, porque la acción la determina el método HTTP; /getAuthors es un ejemplo de lo incorrecto.","D":"Son lecturas, que corresponden a GET, con los datos en la URL; POST es el método de creación y envía los datos en el cuerpo."},"dificultad":"media","tipo":"diferencias","wikiRef":[{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"Buenas prácticas en el diseño de Endpoints"}]},{"id":"prog-09-932ad6e7","asignatura":"prog","tema":"prog-09","enunciado":"Una API responde a GET /books con un array de dos libros entre corchetes y recibe en POST /books un único libro entre llaves con isbn, title y basePrice. Según la wiki, ¿qué diferencia correctamente cómo se corresponde cada estructura JSON en el servidor?","opciones":{"A":"El objeto entre llaves se corresponde con un List de pares clave-valor, y la colección entre corchetes con un único DTO que agrupa todos los libros.","B":"La colección entre corchetes se corresponde con un List de DTOs y el objeto entre llaves con un único DTO; el parser hace ambas conversiones automáticamente.","C":"El parser convierte el objeto entre llaves directamente en la entidad de dominio, y la colección entre corchetes en una lista de entidades de dominio.","D":"Ambas se corresponden con DTOs, pero el parser solo actúa al recibir datos; para enviar el array, el controlador debe construir el texto JSON a mano."},"correcta":"B","explicacionCorrecta":"La wiki indica que un objeto JSON ({ }) se corresponde con un DTO y una colección JSON ([ ]) con un List de DTOs, y que el parser convierte automáticamente el texto JSON en Java Records (DTOs) y al revés cuando el controlador recibe o envía datos.","explicacionesDistractores":{"A":"Invierte la correspondencia: el objeto entre llaves mapea con un DTO y la colección entre corchetes con un List.","C":"El parser convierte el JSON en clases Java Record que actúan como DTO, no en entidades de dominio; la conversión entre DTO y dominio es tarea de otra pieza.","D":"El parser convierte en ambos sentidos (JSON a DTO y DTO a JSON), tanto al recibir como al enviar datos; no hay que construir el JSON a mano."},"dificultad":"media","tipo":"diferencias","wikiRef":[{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"4. Formato de Intercambio: JSON"},{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"Colección JSON (Mapea con un List)"}]},{"id":"prog-09-6368e1f6","asignatura":"prog","tema":"prog-09","enunciado":"Un cliente realiza, en este orden, cuatro peticiones a una API de libros: crea un libro con POST /books; borra con DELETE /books/12 el libro 12, que existía; consulta con GET /books/12 ese mismo libro ya borrado; y lanza una búsqueda que provoca una excepción no controlada en el código del servidor. Según los códigos habituales del tema, ¿qué secuencia de estados recibe?","opciones":{"A":"201 Created, 204 No Content, 404 Not Found y 500 Internal Server Error","B":"201 Created, 204 No Content, 403 Forbidden y 500 Internal Server Error","C":"201 Created, 204 No Content, 404 Not Found y 400 Bad Request","D":"200 OK, 204 No Content, 404 Not Found y 500 Internal Server Error"},"correcta":"A","explicacionCorrecta":"Según la wiki, POST responde 201 Created; DELETE responde habitualmente 204 No Content; si la URL o el recurso solicitado no existe se devuelve 404 Not Found; y una excepción o fallo no controlado dentro del código del servidor produce 500 Internal Server Error.","explicacionesDistractores":{"B":"El recurso borrado ya no existe, lo que corresponde a 404 Not Found; 403 Forbidden indica que el cliente no tiene permisos para acceder al recurso.","C":"400 Bad Request es un error del cliente por datos incorrectos; una excepción no controlada en el código del servidor es un error 5xx, 500 Internal Server Error.","D":"La creación con POST se responde con 201 Created; 200 OK es el habitual de GET, PUT y PATCH."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"5. Códigos de Estado HTTP"},{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"Relación entre método y código de éxito habitual"}]},{"id":"prog-09-d4de944b","asignatura":"prog","tema":"prog-09","enunciado":"Según el tema, ¿qué es REST (REpresentational State Transfer)?","opciones":{"A":"El protocolo de comunicación cliente-servidor sobre el que se intercambian peticiones y respuestas en la web.","B":"El formato estándar, ligero y legible, para enviar y recibir información entre cliente y servidor.","C":"Un estilo de arquitectura para diseñar servicios web centrados en recursos.","D":"Una URL concreta que expone el servidor y a la que el cliente envía peticiones para interactuar con un recurso."},"correcta":"C","explicacionCorrecta":"La wiki define REST como un estilo de arquitectura para diseñar servicios web centrados en recursos, que funciona sobre HTTP/HTTPS.","explicacionesDistractores":{"A":"Describe HTTP, que es el protocolo; la wiki advierte que no se debe confundir con REST, que es un estilo de arquitectura que se apoya en él.","B":"Describe JSON, el formato estándar de intercambio en las APIs REST.","D":"Describe un endpoint, no el estilo de arquitectura REST."},"dificultad":"facil","tipo":"definicion","wikiRef":[{"archivo":"wiki/programacion/tema-09-api-rest-http/contenido.md","seccion":"2. Servicios REST y Diseño de Endpoints"}]},{"id":"prog-10-02073594","asignatura":"prog","tema":"prog-10","enunciado":"Un proyecto Spring Boot registra eventos con loggers de SLF4J en todas sus clases y el equipo decide sustituir Logback por Log4j2. Según la wiki, ¿qué implica ese cambio y qué lo hace posible?","opciones":{"A":"Se cambia por configuración sin retocar ninguna clase, porque el código solo conoce la fachada SLF4J, igual que al programar contra interfaces.","B":"No implica ningún cambio, porque Log4j2 ya es la implementación que Spring Boot incluye por defecto detrás de SLF4J.","C":"Hay que cambiar la declaración del logger en cada clase para usar la API de Log4j2, porque la fachada SLF4J va ligada a Logback.","D":"Se cambia por configuración, porque SLF4J es la implementación que decide formato y destino, y Logback solo es la API con la que escribe el código."},"correcta":"A","explicacionCorrecta":"La wiki separa la fachada (SLF4J, la API con la que el código emite eventos) de la implementación (Logback por defecto, Log4j2 como alternativa). El código solo conoce la fachada y la implementación se cambia por configuración sin retocar ninguna clase, el mismo principio que programar contra interfaces.","explicacionesDistractores":{"B":"La implementación por defecto en Spring Boot es Logback; Log4j2 es la alternativa, sustituible por configuración.","C":"El código solo conoce la fachada SLF4J, que no está ligada a una implementación concreta; por eso no hay que modificar la declaración del logger en las clases.","D":"Invierte los papeles: SLF4J es la fachada (la API del código) y Logback es la implementación que decide el formato y el destino."},"dificultad":"media","tipo":"ventajas-inconvenientes","wikiRef":[{"archivo":"wiki/programacion/tema-10-spring-boot/contenido.md","seccion":"Fachada e implementación"}]},{"id":"prog-10-147d316d","asignatura":"prog","tema":"prog-10","enunciado":"Durante una petición GET /api/v1/books/12, la capa de persistencia lanza una excepción técnica imprevista que no es BookNotFoundException ni IllegalArgumentException. La aplicación tiene el GlobalExceptionHandler del tema, con su logger de SLF4J. ¿Qué ocurre según la wiki?","opciones":{"A":"Se ejecuta handleUnexpected: registra la traza completa con log.error, con nivel ERROR, y devuelve un 500 con el mensaje genérico «Error interno del servidor» en un ApiErrorResponse.","B":"Se ejecuta handleUnexpected, que devuelve un 500 cuyo ApiErrorResponse incluye el mensaje y la traza de la excepción para que el cliente pueda diagnosticar el fallo.","C":"Como ningún manejador declara ese tipo concreto de excepción, el DispatcherServlet genera la Whitelabel Error Page con estado 500.","D":"Se ejecuta handleBadRequest, porque toda excepción imprevista se trata como datos de entrada inválidos, y el cliente recibe un 400 con el mensaje de la excepción."},"correcta":"A","explicacionCorrecta":"El manejador termina con @ExceptionHandler(Exception.class) (handleUnexpected), captura final de cualquier error no previsto, que devuelve ResponseEntity.internalServerError() con ApiErrorResponse(\"Error interno del servidor\"). Antes llama a log.error(\"Error técnico no controlado\", e), de modo que la traza completa queda registrada con nivel ERROR y no viaja al cliente.","explicacionesDistractores":{"B":"La wiki prohíbe devolver al cliente información de una excepción técnica (trazas, nombres de clases, detalles del SQL): el cuerpo lleva un mensaje genérico y los detalles quedan en el log del servidor.","C":"La Whitelabel Error Page aparece cuando la excepción sale sin capturarse y no hay manejador; aquí el @ExceptionHandler(Exception.class) actúa como captura final de cualquier error no previsto.","D":"handleBadRequest solo atiende IllegalArgumentException (datos de entrada inválidos, 400). Un error técnico no previsto corresponde a la captura de Exception y a un 500."},"dificultad":"dificil","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-10-spring-boot/contenido.md","seccion":"Ejemplo práctico: GlobalExceptionHandler"},{"archivo":"wiki/programacion/tema-10-spring-boot/contenido.md","seccion":"Registrar eventos en el código"}]},{"id":"prog-10-39421839","asignatura":"prog","tema":"prog-10","enunciado":"Sobre los endpoints del BookController de ejemplo y el uso de ResponseEntity, ¿cuál de las siguientes afirmaciones es INCORRECTA?","opciones":{"A":"ResponseEntity.ok(x) produce una respuesta 200 OK con x en el cuerpo, como en getAll() y getById().","B":"El método create recibe el BookCreateRequest con @RequestBody y responde con ResponseEntity.status(HttpStatus.CREATED).body(...).","C":"El método delete devuelve un ResponseEntity\u003cBookResponse> con el libro eliminado en el cuerpo y estado 204 No Content.","D":"El controlador solo delega en el Service y traduce el resultado a una respuesta HTTP."},"correcta":"C","explicacionCorrecta":"Es falsa: para el borrado el tipo es ResponseEntity\u003cVoid>, es decir, sin cuerpo, y se construye con ResponseEntity.noContent().build(), que produce 204 No Content.","explicacionesDistractores":{"A":"Es correcta: ResponseEntity.ok(x) produce un 200 con x en el cuerpo; así lo usan getAll() y getById().","B":"Es correcta: create(@RequestBody BookCreateRequest request) responde con ResponseEntity.status(HttpStatus.CREATED).body(createdBook), es decir, 201 Created.","D":"Es correcta: la wiki indica que el controlador solo delega en el Service (findAll, findById, create, delete) y traduce el resultado a una respuesta HTTP."},"dificultad":"media","tipo":"afirmaciones","wikiRef":[{"archivo":"wiki/programacion/tema-10-spring-boot/contenido.md","seccion":"Ejemplo práctico: BookController"}]},{"id":"prog-10-86a38fbd","asignatura":"prog","tema":"prog-10","enunciado":"Según la wiki, ¿qué diferencia el despliegue de una aplicación web Java tradicional del de una aplicación creada con Spring Boot?","opciones":{"A":"La tradicional integra un Tomcat embebido en un .jar, mientras que Spring Boot genera un .war que se despliega manualmente en un servidor externo.","B":"Spring Boot prescinde de Tomcat y utiliza el DispatcherServlet como servidor web propio, por eso se empaqueta como .jar en lugar de .war.","C":"Ambas se despliegan en un Apache Tomcat externo, pero Spring Boot elimina los archivos de despliegue complejos al generar el .war con Spring Initializr.","D":"La tradicional se compila en un .war que se despliega manualmente en un servidor externo como Apache Tomcat; Spring Boot integra un Tomcat embebido en el propio .jar ejecutable."},"correcta":"D","explicacionCorrecta":"La wiki explica que antes había que configurar archivos de despliegue complejos, compilar un .war y desplegarlo manualmente en un servidor externo como Apache Tomcat, mientras que Spring Boot integra un Tomcat embebido dentro del propio ejecutable .jar.","explicacionesDistractores":{"A":"Invierte los papeles: el .war y el servidor externo corresponden al desarrollo tradicional; el Tomcat embebido en el .jar es lo que aporta Spring Boot.","B":"Spring Boot no prescinde de Tomcat, lo embebe; el DispatcherServlet es el Front Controller que enruta las peticiones, no un servidor web.","C":"Con Spring Boot el servidor no es externo sino embebido, y el empaquetado elegido en Spring Initializr es Jar, no .war."},"dificultad":"facil","tipo":"diferencias","wikiRef":[{"archivo":"wiki/programacion/tema-10-spring-boot/contenido.md","seccion":"1. Introducción a Spring Boot"}]},{"id":"prog-10-dcfa0b4b","asignatura":"prog","tema":"prog-10","enunciado":"En el registro de una aplicación Spring Boot, ¿qué papel tiene SLF4J según la wiki?","opciones":{"A":"Es la implementación por defecto de Spring Boot, que decide el formato y el destino de cada evento de log.","B":"Es la fachada: la API con la que el código emite los eventos de log, independiente de la implementación que los procesa.","C":"Es la implementación alternativa que puede sustituir a la de por defecto mediante configuración.","D":"Es la implementación de registro que incluye el propio JDK, sucesora de la antigua Log4j."},"correcta":"B","explicacionCorrecta":"La wiki divide el registro en fachada e implementación: la fachada define la API con la que el código emite eventos y la estándar es SLF4J (Simple Logging Facade for Java). El código solo conoce la fachada.","explicacionesDistractores":{"A":"La implementación por defecto en Spring Boot es Logback, no SLF4J.","C":"La implementación alternativa sustituible por configuración es Log4j2.","D":"La implementación incluida en el JDK es java.util.logging; las sucesoras de la antigua Log4j son Logback y Log4j2."},"dificultad":"facil","tipo":"definicion","wikiRef":[{"archivo":"wiki/programacion/tema-10-spring-boot/contenido.md","seccion":"Fachada e implementación"}]},{"id":"prog-12-53bcba03","asignatura":"prog","tema":"prog-12","enunciado":"Un atacante roba el refresh token R1 de un usuario y lo usa para renovar antes que el cliente legítimo, obteniendo A2 y R2. Más tarde, el cliente legítimo intenta renovar presentando R1. Según el tema, ¿qué ocurre?","opciones":{"A":"El servidor detecta que R1 ya se consumió y revoca toda la familia, incluidos A2 y R2 del atacante; el cliente legítimo también pierde la sesión y debe autenticarse de nuevo.","B":"La renovación del cliente legítimo se rechaza, pero A2 y R2 siguen siendo válidos porque se obtuvieron con un R1 que en ese momento no estaba consumido.","C":"Esta situación no llega a darse: la rotación impide el robo, de modo que el uso de R1 por el atacante se habría rechazado y el cliente legítimo renueva con normalidad.","D":"El servidor reconoce al cliente legítimo como titular original de R1, revoca solo A2 y R2 y le entrega un par nuevo sin pedirle credenciales."},"correcta":"A","explicacionCorrecta":"La wiki indica que si un refresh token ya consumido vuelve a presentarse se revoca toda la familia, incluido el par más reciente, y el cliente legítimo también pierde la sesión y debe autenticarse de nuevo. Precisa además que, si el atacante usa primero el token robado, el reuso posterior por el cliente legítimo revoca también los tokens nuevos.","explicacionesDistractores":{"B":"Al detectar el reuso se revoca toda la familia, incluido el par más reciente (A2 y R2), aunque lo haya obtenido el atacante.","C":"La wiki afirma que la rotación no impide el robo de una credencial; solo permite detectar la reutilización de un refresh token anterior.","D":"El servidor no puede saber cuál de los dos es legítimo, y la respuesta al reuso es revocar toda la familia, tras lo cual hay que autenticarse de nuevo."},"dificultad":"dificil","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"Qué consigue (y qué no) la rotación"},{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"Detección del reuso y revocación de la familia"}]},{"id":"prog-12-6706551a","asignatura":"prog","tema":"prog-12","enunciado":"En la clase SecurityContext del tema, el campo CURRENT es un ThreadLocal\u003cPrincipal> declarado como private static final. ¿Qué afirmación describe con precisión qué se comparte y por qué no se mezclan identidades entre peticiones concurrentes?","opciones":{"A":"Se comparte el objeto ThreadLocal, que mantiene un valor independiente para cada hilo, de modo que no guarda un mismo Principal global para todos.","B":"No se comparte nada, porque cada petición crea su propia instancia de SecurityContext con su propio ThreadLocal.","C":"Se comparte un único Principal global, y es la limpieza en finally la que evita que dos peticiones simultáneas vean la misma identidad.","D":"Se comparte un único Principal global, pero al ser final no puede reasignarse, de modo que cada petición conserva la identidad con la que se creó."},"correcta":"A","explicacionCorrecta":"La wiki matiza que, aunque CURRENT es static, lo que se comparte es el objeto ThreadLocal, que mantiene un valor independiente para cada hilo; no guarda un mismo Principal global para todos.","explicacionesDistractores":{"B":"SecurityContext tiene un constructor privado y no se instancia; expone métodos estáticos sobre un único ThreadLocal estático compartido.","C":"No hay un Principal global: cada hilo tiene su propio valor. La limpieza en finally evita que una petición posterior que reutilice el mismo hilo herede el Principal de otra, no que peticiones simultáneas lo compartan.","D":"El ThreadLocal no guarda un Principal global; final solo afecta al campo CURRENT, y el valor asociado a cada hilo se establece y elimina con set y clear."},"dificultad":"dificil","tipo":"definicion","wikiRef":[{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"Clase SecurityContext"}]},{"id":"prog-12-2c5b0cc8","asignatura":"prog","tema":"prog-12","enunciado":"En la aplicación Spring Boot del tema, AccessTokenFilter extiende OncePerRequestFilter. Según la wiki, ¿qué distingue correctamente lo que pertenece al modelo Servlet de lo que aporta esa clase base?","opciones":{"A":"El filtro y su cadena son un mecanismo propio de Spring, y OncePerRequestFilter es la clase que crea esa cadena dentro de la aplicación.","B":"El modelo Servlet solo aporta los objetos de petición y respuesta; la posición del filtro en la cadena la decide Spring al extender la clase base.","C":"OncePerRequestFilter forma parte del modelo Servlet y define la cadena; la integración con Spring se limita a extraer el token Bearer.","D":"La idea del filtro y su posición en la cadena que procesa cada petición pertenecen al modelo Servlet; la clase base gestiona su integración con Spring."},"correcta":"D","explicacionCorrecta":"La wiki indica que, en Spring Boot, el filtro Servlet puede implementarse extendiendo OncePerRequestFilter, cuya clase base gestiona su integración con Spring, mientras que la idea del filtro y su posición en la cadena pertenecen al modelo Servlet, no a Spring.","explicacionesDistractores":{"A":"La wiki atribuye la idea del filtro y su posición en la cadena al modelo Servlet, no a Spring; OncePerRequestFilter solo es la clase base que integra el filtro con Spring.","B":"La posición del filtro en la cadena pertenece al modelo Servlet; no la decide Spring por el hecho de extender la clase base.","C":"OncePerRequestFilter es la clase base que gestiona la integración con Spring; la extracción del token Bearer es lógica propia de AccessTokenFilter (extractBearerToken), no la integración."},"dificultad":"media","tipo":"diferencias","wikiRef":[{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"7. Filtro Servlet y SecurityContext propio"}]},{"id":"prog-12-69111c8a","asignatura":"prog","tema":"prog-12","enunciado":"Una aplicación cliente envía a la vez dos peticiones de renovación con el mismo refresh token R1, porque dos de sus componentes detectaron al mismo tiempo que el token de acceso había caducado. Según el tema, ¿qué problema plantea y qué se recomienda?","opciones":{"A":"Ninguno: el servidor devuelve el mismo par A2 + R2 a las dos peticiones, ya que ambas pertenecen a la misma sesión.","B":"La segunda presentación de R1, ya consumido, se trata como una reutilización, que puede llevar a revocar toda la familia; por eso el cliente debe coordinar la renovación y evitar solicitudes simultáneas con el mismo refresh token.","C":"Que las dos peticiones obtengan pares válidos distintos; se evita separando el consumo de R1 y la creación del nuevo par en operaciones independientes.","D":"Solo supone un coste de rendimiento; se evita enviando el refresh token en todas las peticiones normales para renovar antes de que caduque el token de acceso."},"correcta":"B","explicacionCorrecta":"En la renovación el servidor valida y consume R1, que queda inválido. Si un refresh token ya consumido vuelve a presentarse, el servidor no puede distinguir a un atacante de un cliente legítimo con una copia antigua y revoca toda la familia. Por eso la wiki exige que el cliente coordine la renovación y evite solicitudes simultáneas con el mismo refresh token.","explicacionesDistractores":{"A":"El servidor consume R1 en la primera renovación y R1 queda inválido; su nueva presentación es un reuso, no una petición que reciba el mismo par.","C":"La wiki exige lo contrario: el consumo de R1 y la creación del nuevo par deben ser atómicos.","D":"El refresh token no se incluye en las peticiones normales; solo se envía para renovar el par."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"Atomicidad y coordinación"},{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"5. Reutilización de un refresh token"}]},{"id":"prog-12-8ce98b4a","asignatura":"prog","tema":"prog-12","enunciado":"Un usuario que inició sesión correctamente envía un token de acceso válido para invocar una operación de administración, pero su rol no la permite. Según la wiki, ¿cómo se interpreta esta situación?","opciones":{"A":"Falla la autenticación, porque un token que no da acceso a la operación solicitada no permite identificar a quien realiza la petición.","B":"La operación se permite, porque el login ya autenticó al usuario y, con ello, quedó autorizado para todas las operaciones de la sesión.","C":"La petición está autenticada, porque el servidor valida el token y recupera la identidad, pero no autorizada, porque su rol no permite la operación.","D":"Falla la autorización del login, que es el único momento en que el servidor comprueba las credenciales y los permisos del usuario."},"correcta":"C","explicacionCorrecta":"La autenticación responde a quién hace la petición (en las peticiones posteriores, validando el token) y la autorización a qué puede hacer esa identidad, evaluada para la operación solicitada. La wiki subraya que una petición puede estar autenticada y aun así no tener permiso.","explicacionesDistractores":{"A":"El token es válido y el servidor recupera la identidad, así que la autenticación tiene éxito; lo que falla es el permiso, que es cuestión de autorización.","B":"Autenticar no implica autorizar: la autorización se evalúa para cada operación solicitada, comprobando los permisos que requiere.","D":"La autorización no se resuelve en el login; en cada petición protegida el servidor valida el token, recupera la identidad y comprueba los permisos de esa operación."},"dificultad":"media","tipo":"diferencias","wikiRef":[{"archivo":"wiki/programacion/tema-12-login-tokens/contenido.md","seccion":"1. Autenticación y autorización"}]},{"id":"dws-01-43e56e66","asignatura":"dws","tema":"dws-01","enunciado":"Una aplicación sigue la arquitectura hexagonal del tema: BusinessService usa el puerto NotificationPort, que hoy implementa EmailAdapter conectado al servicio de correo. Se decide enviar las notificaciones por SMS. Si se respeta la arquitectura, ¿qué cambio se hace?","opciones":{"A":"Se modifica NotificationPort para que exponga las operaciones del proveedor de SMS, y BusinessService se adapta a la nueva interfaz","B":"Se añade un adaptador de SMS que implementa el NotificationPort existente; el núcleo, con BusinessService y sus puertos, no cambia","C":"Se cambia BusinessService para que dependa directamente del nuevo adaptador de SMS en lugar de EmailAdapter","D":"Se añade un nuevo puerto de entrada para el SMS, que RestController invoca para enviar la notificación desde el adaptador de entrada"},"correcta":"B","explicacionCorrecta":"En la arquitectura hexagonal el núcleo define los puertos (qué necesita) y los adaptadores, fuera del núcleo, los implementan y conectan con tecnologías concretas. La comparativa indica que este enfoque facilita sustituir tecnologías, y el principio de independencia de agentes externos dice que el negocio no depende de servicios externos concretos: basta con otro adaptador que implemente NotificationPort.","explicacionesDistractores":{"A":"Los puertos los define el núcleo según lo que necesita, no según una tecnología concreta; adaptar el puerto al proveedor haría que el negocio dependiera de un servicio externo concreto.","C":"BusinessService usa el puerto NotificationPort, no un adaptador; depender de un adaptador invertiría la dirección de las dependencias, que deben apuntar hacia el núcleo.","D":"El puerto de entrada (InputPort) define cómo se usa el núcleo y lo invoca el adaptador de entrada; la notificación es una necesidad del núcleo, que se expresa con un puerto de salida."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"2.2 Arquitectura hexagonal (Ports and Adapters)"},{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"1. Principios de arquitectura limpia"}]},{"id":"dws-01-7a29662a","asignatura":"dws","tema":"dws-01","enunciado":"Entre los principios de arquitectura limpia figuran la regla de dependencia y la inversión de dependencias (DIP). ¿Cuál es la definición correcta de la regla de dependencia?","opciones":{"A":"El núcleo define las abstracciones que necesita y los detalles externos, como la persistencia, se encargan de implementarlas.","B":"El código depende hacia las políticas de negocio, no hacia los detalles, de modo que las dependencias apuntan hacia el dominio.","C":"Cada capa depende solo de la capa inmediatamente inferior, de forma que el dominio depende de la persistencia y esta de la base de datos.","D":"Las dependencias apuntan desde el dominio hacia los anillos exteriores, que son los que contienen los detalles técnicos."},"correcta":"B","explicacionCorrecta":"La tabla de principios define la regla de dependencia como «el código depende hacia las políticas de negocio, no hacia los detalles»; en todos los diagramas del tema las flechas apuntan hacia el dominio o núcleo.","explicacionesDistractores":{"A":"Es la definición de la inversión de dependencias (DIP), no de la regla de dependencia. La wiki las distingue: la regla dice hacia dónde apuntan las dependencias y la DIP es el mecanismo para conseguirlo.","C":"La wiki insiste en evitar que el dominio dependa de tecnologías: domain define la interfaz Repository y persistence la implementa, así que el dominio no depende de la persistencia.","D":"Invierte el sentido: en la arquitectura de cebolla y en general, las dependencias apuntan desde los anillos externos hacia el núcleo, no al revés."},"dificultad":"media","tipo":"definicion","wikiRef":[{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"1. Principios de arquitectura limpia"},{"archivo":"wiki/dws/tema-01-arquitecturas/conceptos.md","seccion":"Regla de dependencia"}]},{"id":"dws-01-e99be59d","asignatura":"dws","tema":"dws-01","enunciado":"Al comparar el diagrama de la arquitectura por capas de referencia con el de la arquitectura de cebolla, ¿qué diferencia hay en la ubicación de sus elementos?","opciones":{"A":"En ambas el servicio, el modelo y la interfaz Repository están en el mismo paquete o anillo; solo cambia que la cebolla coloca RepositoryImpl en infraestructura.","B":"En la de capas la interfaz Repository está en persistence junto a su implementación; en la de cebolla está en el núcleo de dominio y RepositoryImpl en infraestructura.","C":"En la de capas el servicio está en domain; en la de cebolla el servicio está en el núcleo de dominio y el modelo pasa al anillo intermedio de aplicación.","D":"En la de capas el servicio está en domain junto al modelo y la interfaz Repository; en la de cebolla el servicio está en el anillo de aplicación, mientras que Repository y Model forman el núcleo de dominio."},"correcta":"D","explicacionCorrecta":"En la arquitectura por capas de referencia, domain contiene la interfaz Service, ServiceImpl, Model y la interfaz Repository. En el diagrama de cebolla, Service está en el anillo intermedio (Aplicación), mientras que la interfaz Repository y Model están en el núcleo (Dominio); RepositoryImpl está en el anillo exterior de infraestructura.","explicacionesDistractores":{"A":"En la cebolla el servicio no comparte anillo con Model y Repository: está en el anillo de aplicación, separado del núcleo de dominio.","B":"En la arquitectura por capas la interfaz Repository se define en domain y persistence la implementa (inversión de dependencias); no está en persistence.","C":"Está invertido: en la cebolla el modelo está en el núcleo de dominio y el servicio en el anillo intermedio de aplicación."},"dificultad":"dificil","tipo":"diferencias","wikiRef":[{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"2.1 Arquitectura por capas"},{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"2.3 Arquitectura de cebolla"}]},{"id":"dws-01-0fd5f32a","asignatura":"dws","tema":"dws-01","enunciado":"En el diagrama de secuencia de la comunicación síncrona entre microservicios, un Cliente envía una solicitud al Servicio A, que necesita datos del Servicio B. Un día el Servicio B tarda mucho en contestar. ¿Qué ocurre con la solicitud del Cliente?","opciones":{"A":"El Servicio A devuelve el resultado al Cliente de inmediato y la petición al Servicio B se procesa después, cuando este esté disponible","B":"El Servicio A espera la respuesta del Servicio B antes de devolver el resultado, así que la respuesta al Cliente se retrasa con B","C":"La petición al Servicio B pasa automáticamente por el broker de mensajes, que la reintenta hasta que se confirma su procesamiento","D":"El Servicio B, al terminar, envía la respuesta directamente al Cliente, de modo que el Servicio A queda libre mientras tanto"},"correcta":"B","explicacionCorrecta":"En la secuencia síncrona HTTP el orden es: Cliente → A «solicitud», A → B «petición HTTP», B → A «respuesta», A → Cliente «resultado». En la comunicación síncrona el emisor hace una llamada y espera una respuesta, por lo que depende de la disponibilidad y el tiempo de respuesta del receptor.","explicacionesDistractores":{"A":"Procesar después, sin esperar, describe la comunicación asíncrona mediante eventos, no la llamada HTTP síncrona del diagrama.","C":"El broker solo interviene en la comunicación asíncrona mediante eventos (publicar, entregar, confirmar); la petición HTTP síncrona va directamente de A a B.","D":"En el diagrama el Servicio B responde al Servicio A, y es A quien devuelve el resultado al Cliente."},"dificultad":"media","tipo":"funcionamiento-interno","wikiRef":[{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"3.2 Tipos de comunicación"},{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"Diagrama de secuencia: tres formas de comunicación"}]},{"id":"dws-01-b56b154b","asignatura":"dws","tema":"dws-01","enunciado":"Un equipo va a desarrollar una aplicación CRUD pequeña y valora desplegarla como un monolito clásico. ¿Qué valoración de ventajas e inconvenientes es correcta según la wiki?","opciones":{"A":"Es una opción descartable, porque un monolito implica código desordenado y no puede organizarse por capas con inversión de dependencias.","B":"Es adecuada por su despliegue independiente de cada componente, aunque obliga a que cada componente tenga su propia base de datos.","C":"Es adecuada solo si se organiza en módulos con APIs internas explícitas, porque sin ellos un monolito no puede aplicar principios de arquitectura limpia.","D":"Puede ser adecuada: ofrece una operación sencilla y no implica código desordenado, aunque, si crece, puede acabar con un alto acoplamiento."},"correcta":"D","explicacionCorrecta":"La tabla de estilos de despliegue atribuye al monolito una operación sencilla y el riesgo de crecer con alto acoplamiento; la wiki añade que un monolito no implica código desordenado, que puede ser adecuado para una aplicación pequeña como un CRUD y que puede aplicar principios de arquitectura limpia.","explicacionesDistractores":{"A":"La wiki afirma expresamente que un monolito no implica código desordenado y que puede aplicar principios de arquitectura limpia; la organización interna y el despliegue son criterios independientes.","B":"El despliegue independiente y el control de datos propios de cada servicio son características de los microservicios; el monolito es una única aplicación desplegable cuyos componentes pueden compartir almacenamiento.","C":"Los módulos con APIs internas explícitas caracterizan al monolito modular, pero no son requisito para aplicar arquitectura limpia: la wiki dice que un monolito puede aplicar sus principios."},"dificultad":"media","tipo":"ventajas-inconvenientes","wikiRef":[{"archivo":"wiki/dws/tema-01-arquitecturas/contenido.md","seccion":"3.1 Monolito, monolito modular y microservicios"}]},{"id":"dws-02-9907510d","asignatura":"dws","tema":"dws-02","enunciado":"Un proyecto usa orders-api.yaml como fuente de verdad y OpenAPI Generator para generar interfaces y DTO. El equipo quiere eliminar un campo de la respuesta de una operación y un desarrollador propone borrarlo directamente de la clase DTO generada en target/generated-sources/openapi. ¿Qué valoración es correcta?","opciones":{"A":"Hay que modificar orders-api.yaml y regenerar el código, y además, como eliminar un campo puede romper clientes, el cambio no debe hacerse sin una transición acordada.","B":"La propuesta es válida, porque una vez generadas las clases pasan a ser la fuente de verdad del contrato y el archivo YAML solo sirve como documentación.","C":"Hay que modificar orders-api.yaml y regenerar el código; al ser una eliminación y no un cambio de tipo, es compatible y no requiere transición con los consumidores.","D":"Hay que modificar orders-api.yaml y regenerar el código, y basta con abrir Swagger UI y ver que el campo ya no aparece para demostrar que la implementación cumple el contrato."},"correcta":"A","explicacionCorrecta":"Las clases generadas se pueden consultar pero no se deben modificar directamente: si cambia el contrato, se vuelve a generar el código. Además, eliminar un campo es un ejemplo de cambio que puede romper clientes, y al revisar cambios se comprueba que no rompan compatibilidad sin una transición acordada.","explicacionesDistractores":{"B":"La fuente de verdad es el archivo OpenAPI; las clases generadas no deben modificarse directamente y, si cambia el contrato, se regeneran.","C":"La wiki cita eliminar un campo, junto con cambiar su tipo o alterar el significado de una respuesta, como cambios que pueden romper clientes.","D":"Abrir Swagger UI no demuestra por sí solo la conformidad; las pruebas HTTP de controller verifican el comportamiento integrado y hay que comprobar que la implementación se ajusta al archivo OpenAPI."},"dificultad":"dificil","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"OpenAPI Generator y Maven"},{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"4. Cambios y comprobaciones"}]},{"id":"dws-02-d7d58cf1","asignatura":"dws","tema":"dws-02","enunciado":"Un equipo diseña primero la interfaz Java OrderHttpApi con sus rutas, parámetros y documentación, la revisa con los consumidores y solo después escribe OrderController, que la implementa; springdoc-openapi genera la documentación. ¿Qué valoración de este planteamiento es correcta según el tema?","opciones":{"A":"Puede formar parte de un flujo API First y separa las declaraciones del contrato HTTP de la lógica del controlador, pero queda ligada al código Java y sus cambios exigen revisar el contrato resultante.","B":"Equivale a usar un archivo orders-api.yaml como fuente de verdad: el documento generado es una especificación independiente del código y sirve para generar interfaces y DTO con OpenAPI Generator.","C":"Separa el contrato de la lógica del controlador, pero obliga a mantener además un archivo OpenAPI escrito a mano para que springdoc-openapi pueda generar Swagger UI.","D":"Es necesariamente Code First, porque el contrato se declara en código Java y springdoc-openapi lo deriva de las anotaciones, de modo que no puede formar parte de un flujo API First."},"correcta":"A","explicacionCorrecta":"La wiki explica que la interfaz Java como contrato separa las declaraciones del contrato HTTP de la lógica del controlador y permite a springdoc-openapi generar la documentación; puede diseñarse antes de implementar el controlador y formar parte de un flujo API First, pero queda ligada al código Java. En la comparativa, su precaución es que se define desde el código y los cambios requieren revisar el contrato resultante.","explicacionesDistractores":{"B":"La wiki dice que con la interfaz Java el documento generado no es una especificación independiente del código; la independencia y la generación de interfaces y DTO corresponden al archivo OpenAPI con OpenAPI Generator.","C":"springdoc-openapi genera el documento OpenAPI y Swagger UI a partir de las anotaciones del código; además, la wiki advierte que mantener dos contratos manuales puede hacerlos divergir.","D":"La wiki afirma expresamente que la interfaz puede diseñarse antes de implementar el controlador y formar parte de un flujo API First."},"dificultad":"dificil","tipo":"ventajas-inconvenientes","wikiRef":[{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"Opción 1: interfaz Java como contrato"},{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"Comparativa de fuentes del contrato"}]},{"id":"dws-02-29daa1db","asignatura":"dws","tema":"dws-02","enunciado":"Un equipo diseña el contrato de una nueva API, lo implementa de inmediato y, ya terminada la implementación, lo enseña por primera vez a los equipos cliente, que piden varios cambios en las operaciones. Comparado con el flujo API First que describe el tema, ¿qué paso explica mejor el problema?","opciones":{"A":"Se omitió revisar y acordar el contrato, paso que en API First va entre diseñar el contrato e implementar la API.","B":"Se omitió comprobar el contrato, paso que en API First es el previo a implementar la API y en el que se acuerdan los cambios con los clientes.","C":"Se siguió el orden correcto de API First, en el que el contrato se acuerda con los clientes después de implementar y antes de comprobarlo.","D":"Faltó publicar el contrato en Swagger UI antes de implementar, porque en API First esa publicación sustituye a la revisión con los clientes."},"correcta":"A","explicacionCorrecta":"El diagrama del flujo API First encadena cuatro pasos: diseñar contrato, revisar y acordar, implementar API y comprobar contrato. El contrato se diseña y se acuerda antes de la implementación; el equipo saltó directamente de diseñar a implementar sin revisar ni acordar con los clientes.","explicacionesDistractores":{"B":"En el flujo, comprobar el contrato es el último paso, tras implementar, para verificar que la API lo cumple; el acuerdo con los clientes corresponde a «revisar y acordar».","C":"En API First el contrato se diseña y se acuerda antes de la implementación, no después.","D":"La wiki advierte que la documentación no sustituye el diseño, la revisión de compatibilidad ni las pruebas; Swagger UI ayuda a explorar el contrato, no reemplaza el acuerdo."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"Diagrama del flujo API First"}]},{"id":"dws-02-7690fbcd","asignatura":"dws","tema":"dws-02","enunciado":"¿Qué afirmación distingue correctamente OpenAPI, Swagger y Swagger UI?","opciones":{"A":"OpenAPI es una biblioteca de Spring que genera documentación a partir de anotaciones; Swagger es su formato de archivo, y Swagger UI su editor de contratos.","B":"Swagger es la especificación que describe rutas, parámetros y respuestas; OpenAPI es la herramienta que la presenta como documentación interactiva, y Swagger UI la valida.","C":"OpenAPI es una especificación en YAML o JSON; Swagger UI es la herramienta que comprueba que la implementación cumple ese contrato, por lo que sustituye a las pruebas HTTP.","D":"OpenAPI es una especificación para describir APIs HTTP en YAML o JSON; Swagger es un conjunto de herramientas para trabajar con ella, y Swagger UI presenta el contrato como documentación interactiva."},"correcta":"D","explicacionCorrecta":"Según la wiki, OpenAPI es una especificación para describir APIs HTTP en YAML o JSON (rutas, operaciones, parámetros, esquemas, respuestas y restricciones); Swagger es un conjunto de herramientas para trabajar con OpenAPI, y Swagger UI presenta el contrato como documentación interactiva.","explicacionesDistractores":{"A":"La herramienta de Spring que genera documentación OpenAPI a partir de anotaciones es springdoc-openapi; OpenAPI es la especificación, no una biblioteca.","B":"Intercambia los papeles: OpenAPI es la especificación y Swagger el conjunto de herramientas; Swagger UI presenta el contrato como documentación interactiva, no lo valida.","C":"Swagger UI ayuda a explorar el contrato, pero abrirlo no demuestra por sí solo la conformidad; la documentación no sustituye las pruebas."},"dificultad":"media","tipo":"diferencias","wikiRef":[{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"2. OpenAPI y Swagger"},{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"4. Cambios y comprobaciones"}]},{"id":"dws-02-d83ef09b","asignatura":"dws","tema":"dws-02","enunciado":"Una API de pedidos debe exigir que el email del cliente tenga un formato válido y que su nombre no esté vacío; además, un pedido no puede superar el crédito disponible del cliente. Según el tema, ¿cómo se reparten estas validaciones?","opciones":{"A":"Todas se declaran con Jakarta Bean Validation en los DTO de entrada, porque son condiciones sobre los datos que cruzan la frontera HTTP.","B":"El formato del email y el nombre obligatorio se declaran con Jakarta Bean Validation en la capa de presentación; el límite de crédito es una regla de negocio que pertenece al dominio.","C":"Todas pertenecen al dominio; Jakarta Bean Validation solo sirve para documentar en el contrato OpenAPI las restricciones que comprueba el dominio.","D":"El formato del email y el nombre obligatorio se comprueban en el dominio, y el límite de crédito se declara con anotaciones como @Size y @Valid en la capa de presentación."},"correcta":"B","explicacionCorrecta":"La wiki indica que la validación del formato de la solicitud (campos obligatorios, formatos, longitudes) se declara con Jakarta Bean Validation (@NotBlank, @Email, @Size, @Valid) y corresponde a la capa de presentación, mientras que las reglas de negocio siguen perteneciendo al dominio. El email y el nombre obligatorio son formato; el límite de crédito es una regla de negocio.","explicacionesDistractores":{"A":"Jakarta Bean Validation cubre el formato de la solicitud; la wiki precisa que las reglas de negocio, como el límite de crédito, siguen perteneciendo al dominio.","C":"La wiki atribuye a Jakarta Bean Validation la validación del formato de la solicitud en la capa de presentación, no una mera función de documentación; solo las reglas de negocio pertenecen al dominio.","D":"Invierte el reparto: el formato (campos obligatorios, formatos) corresponde a la capa de presentación con Jakarta Bean Validation, y las reglas de negocio pertenecen al dominio."},"dificultad":"media","tipo":"diferencias","wikiRef":[{"archivo":"wiki/dws/tema-02-api-first/contenido.md","seccion":"02 - API First"}]},{"id":"dws-03-8889a85c","asignatura":"dws","tema":"dws-03","enunciado":"Un equipo ya tiene IbanTest con pruebas unitarias del value object Iban. En CreateAccountValidationTest (@WebMvcTest con MockMvc) añade un test por cada IBAN inválido de IbanTest y, en las pruebas de cada operación, vuelve a comprobar el formato ProblemDetail de los errores. ¿Qué valoración es correcta?","opciones":{"A":"Es el reparto adecuado, porque la validación declarada con anotaciones la aplica Spring y estas pruebas deben verificar exhaustivamente que el framework funciona.","B":"Repite casos ya cubiertos por el value object, cuyas pruebas unitarias son las más baratas; las de integración HTTP deben verificar el rechazo de cada ruta errónea, y el formato del manejador se prueba una sola vez.","C":"Es redundante en el IBAN, pero el formato ProblemDetail sí debe comprobarse en cada operación, porque cada una devuelve campos distintos en errors.","D":"Lo correcto sería lo contrario: probar los IBAN inválidos solo vía HTTP y eliminar IbanTest, porque un value object no puede probarse sin levantar el framework."},"correcta":"B","explicacionCorrecta":"La wiki reparte las pruebas: los value objects se prueban con tests unitarios sin framework ni mocks (las piezas más baratas de probar); las pruebas de integración HTTP del DTO verifican el rechazo y no repiten los casos ya cubiertos por el value object; y el formato del manejador de errores se prueba una vez, no en cada operación.","explicacionesDistractores":{"A":"La wiki indica que la validación declarada con anotaciones la aplica el framework y que probar Spring no es responsabilidad de estos tests.","C":"Todas las operaciones comparten el mismo formato de error porque lo produce un manejador compartido; por eso su formato se prueba una vez, no en cada operación.","D":"Los value objects se prueban con tests unitarios sin framework ni mocks; precisamente son las piezas más baratas de probar."},"dificultad":"dificil","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-03-validacion/contenido.md","seccion":"5. Pruebas"}]},{"id":"dws-03-8cc8cfb2","asignatura":"dws","tema":"dws-03","enunciado":"Un DTO de entrada declara su campo iban solo con @ValidIban, sin @NotBlank, y el parámetro del controller lleva @Valid. Llega una petición en la que iban viene a null. ¿Qué hace la validación de formato con ese campo?","opciones":{"A":"Lo rechaza con un 400 y el mensaje «El formato del IBAN no es válido», porque null no cumple la expresión ^ES\\d{22}$","B":"Lo da por válido, porque IbanFormatValidator devuelve true ante null: la obligatoriedad corresponde a @NotBlank, que falta en el campo","C":"Lo rechaza con una excepción de dominio InvalidIbanException, porque la constraint delega en el constructor compacto del record Iban","D":"No llega a evaluarlo, porque Spring solo aplica las constraints personalizadas cuando el campo lleva además una constraint estándar"},"correcta":"B","explicacionCorrecta":"En isValid, si value es null IbanFormatValidator devuelve true, porque la obligatoriedad corresponde a @NotBlank y no a esta constraint; solo en otro caso comprueba ^ES\\d{22}$. Sin @NotBlank, nada en la validación de formato exige que el campo tenga valor.","explicacionesDistractores":{"A":"La expresión regular solo se comprueba cuando el valor no es null; ante null la validadora devuelve true y no se produce ese mensaje.","C":"La constraint delega en la clase validadora IbanFormatValidator, no en el value object; InvalidIbanException la lanza el constructor del record Iban del dominio.","D":"La wiki no condiciona las constraints personalizadas a la presencia de una estándar: con @Valid en el parámetro, Spring valida el DTO y su constraint se evalúa."},"dificultad":"media","tipo":"funcionamiento-interno","wikiRef":[{"archivo":"wiki/dws/tema-03-validacion/contenido.md","seccion":"2.3 Constraints personalizadas"}]},{"id":"dws-03-a764c07a","asignatura":"dws","tema":"dws-03","enunciado":"En una operación nueva, el parámetro se declara como @RequestBody CreateAccountRequest request, sin @Valid, aunque el DTO lleva @NotBlank @Email en email. La aplicación tiene el GlobalValidationHandler del tema. Llega una petición con email «no-email». ¿Qué ocurre?","opciones":{"A":"Spring detecta las anotaciones del DTO y lo valida igualmente, de modo que el manejador central devuelve un 400 con ProblemDetail","B":"El DTO no se valida, porque sin @Valid las anotaciones no se aplican; no se lanza MethodArgumentNotValidException y el controller ejecuta su cuerpo","C":"El controller ejecuta su cuerpo y, al terminar, el manejador central comprueba las anotaciones y sustituye la respuesta por un 400","D":"La aplicación no arranca, porque Spring exige @Valid en todo parámetro @RequestBody cuyo DTO tenga anotaciones de Jakarta Validation"},"correcta":"B","explicacionCorrecta":"Spring valida el DTO de entrada cuando el parámetro del controller se anota con @Valid; sin @Valid el DTO no se valida aunque lleve anotaciones, es una decisión explícita operación por operación. Al no fallar ninguna validación, no se lanza la excepción que atiende el manejador central y el controller ejecuta su cuerpo.","explicacionesDistractores":{"A":"Las anotaciones por sí solas no activan la validación: la activa @Valid en el parámetro.","C":"Cuando la validación se aplica, la excepción se lanza antes de que el controller ejecute su cuerpo; el manejador no revisa anotaciones después.","D":"La wiki presenta @Valid como una decisión explícita por operación, no como un requisito cuyo incumplimiento impida arrancar."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-03-validacion/contenido.md","seccion":"2.2 Validación automática y en cascada"},{"archivo":"wiki/dws/tema-03-validacion/contenido.md","seccion":"2.4 El resultado: 400 coherente con la API"}]},{"id":"dws-03-f3d29679","asignatura":"dws","tema":"dws-03","enunciado":"¿Cuál es la definición precisa de value object que da el tema de validación e invariancias?","opciones":{"A":"Un tipo de la capa de presentación que describe el contrato de una operación y cuyos campos llevan anotadas las restricciones de formato.","B":"Un tipo pequeño e inmutable, comparado por identidad, que valida sus datos con anotaciones de Jakarta Validation cuando un framework lo construye.","C":"Un tipo pequeño, inmutable y comparado por valor que representa un concepto de negocio y protege sus invariantes en su propia construcción.","D":"Un tipo pequeño y comparado por valor que puede crearse con datos inválidos y ofrece un método para validarlos antes de persistirlo."},"correcta":"C","explicacionCorrecta":"La wiki define el value object como un tipo pequeño, inmutable y comparado por valor que representa un concepto de negocio y protege sus invariantes en su propia construcción: si los datos no son válidos, el objeto no existe.","explicacionesDistractores":{"A":"Describe el DTO de entrada, que la wiki pide no confundir con el value object.","B":"Se compara por valor, no por identidad, y no usa Jakarta Validation: esas anotaciones solo actúan donde un framework valida y su dependencia está prohibida en el dominio.","D":"Contradice la idea central: el value object valida en su construcción y, si los datos no son válidos, el objeto no llega a existir."},"dificultad":"facil","tipo":"definicion","wikiRef":[{"archivo":"wiki/dws/tema-03-validacion/contenido.md","seccion":"3. Invariancias con value objects"}]},{"id":"dws-03-13d8cd48","asignatura":"dws","tema":"dws-03","enunciado":"¿Qué diferencia hay entre las anotaciones de presencia @NotNull, @NotBlank y @NotEmpty de Jakarta Validation?","opciones":{"A":"@NotNull exige que la cadena tenga contenido, @NotBlank que haya valor y @NotEmpty que la colección no esté vacía.","B":"@NotNull exige que haya valor, @NotBlank que la colección no esté vacía y @NotEmpty que la cadena tenga contenido.","C":"@NotNull exige que haya valor, @NotBlank que la cadena tenga contenido y @NotEmpty que la colección no esté vacía.","D":"Las tres comprueban lo mismo, que el valor no sea nulo, y solo difieren en el mensaje de error por defecto."},"correcta":"C","explicacionCorrecta":"La wiki precisa el matiz de las tres anotaciones de presencia: @NotNull exige que haya valor; @NotBlank, que la cadena tenga contenido; @NotEmpty, que la colección no esté vacía.","explicacionesDistractores":{"A":"Intercambia @NotNull y @NotBlank: @NotNull exige valor y @NotBlank exige que la cadena tenga contenido.","B":"Intercambia @NotBlank y @NotEmpty: @NotBlank se refiere a cadenas con contenido y @NotEmpty a colecciones no vacías.","D":"La wiki distingue qué comprueba cada una (valor, cadena con contenido, colección no vacía); no son equivalentes."},"dificultad":"facil","tipo":"diferencias","wikiRef":[{"archivo":"wiki/dws/tema-03-validacion/contenido.md","seccion":"2.1 Constraints estándar"}]},{"id":"dws-04-05b0459f","asignatura":"dws","tema":"dws-04","enunciado":"En el módulo de catálogo, CatalogModule es la API pública y CatalogModuleImpl su implementación. ¿Qué afirmación es correcta?","opciones":{"A":"CatalogModuleImpl se ubica en el paquete raíz catalog junto a CatalogModule, porque la implementación de la API pública también forma parte del contrato del módulo.","B":"CatalogModuleImpl delega en CatalogController, que invoca a CatalogService, de modo que las llamadas de otros módulos atraviesan la misma entrada que las peticiones HTTP.","C":"Al estar CatalogModuleImpl en un paquete internal, Java impide que otros módulos la usen, por lo que el límite se cumple sin necesidad de tests de arquitectura.","D":"CatalogModuleImpl vive en internal.application y delega en CatalogService, de modo que orders depende del contrato CatalogModule y no de esa implementación ni del servicio."},"correcta":"D","explicacionCorrecta":"La wiki indica que CatalogModuleImpl vive en internal.application y delega en CatalogService, que forma parte de la implementación interna; así, otro módulo depende del contrato del catálogo (CatalogModule), no de esa clase de implementación ni de su servicio.","explicacionesDistractores":{"A":"En el paquete raíz com.example.store.catalog solo está la API pública CatalogModule; CatalogModuleImpl es implementación interna y vive en catalog.internal.application.","B":"La entrada entre módulos es CatalogModule → CatalogModuleImpl → CatalogService, sin pasar por CatalogController; la entrada HTTP es una ruta distinta que confluye en CatalogService.","C":"La wiki aclara que estar en un paquete internal no hace inaccesible una clase en Java: si es pública, otras clases pueden usarla; por eso se usan tests de arquitectura como los de ArchUnit."},"dificultad":"dificil","tipo":"afirmaciones","wikiRef":[{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"2. API pública e implementación interna"},{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"2.1 Verificar los límites entre módulos"}]},{"id":"dws-04-37ca2f59","asignatura":"dws","tema":"dws-04","enunciado":"Con Spring Modulith, un equipo traslada BookSummary desde com.example.store.catalog.dto directamente al paquete raíz com.example.store.catalog. ¿Qué consecuencia tiene para su exposición a otros módulos?","opciones":{"A":"Deja de ser accesible, porque el paquete raíz solo contiene la API pública CatalogModule y los DTO deben estar en un subpaquete con nombre","B":"Sigue necesitando @NamedInterface, ahora en el package-info.java del paquete raíz, para que otros módulos puedan usarlo","C":"Pasa a ser público, pero solo tras arrancar el contexto de Spring, que es cuando Modulith recalcula qué paquetes forman la API","D":"Pasa a ser público por defecto, sin @NamedInterface; el package-info.java solo haría falta si se quiere declarar @ApplicationModule"},"correcta":"D","explicacionCorrecta":"El paquete raíz de cada módulo constituye su API pública. La wiki aconseja que los DTO pueden colocarse directamente en el paquete raíz, donde son públicos por defecto, sin usar @NamedInterface ni crear package-info.java para exponerlos; aun así, package-info.java puede utilizarse para declarar @ApplicationModule y sus dependencias permitidas.","explicacionesDistractores":{"A":"El paquete raíz es la API pública del módulo y lo que contiene es público; los DTO pueden colocarse allí.","B":"@NamedInterface sirve para exponer subpaquetes; en el paquete raíz no hace falta.","C":"Modulith deriva el modelo modular de los paquetes; su verificación no necesita arrancar el contexto de Spring."},"dificultad":"media","tipo":"funcionamiento-interno","wikiRef":[{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"Relación con ArchUnit"},{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"API pública y subpaquetes internos"}]},{"id":"dws-04-906f76dc","asignatura":"dws","tema":"dws-04","enunciado":"Una aplicación con Spring Modulith tiene su clase principal en com.example.store, con los módulos catalog y orders. El equipo crea dos paquetes nuevos: com.example.store.payments y com.example.store.orders.internal.usecase. Con la detección por defecto, ¿cómo se interpretan?","opciones":{"A":"Ambos se detectan como módulos nuevos, porque los dos están dentro del paquete base com.example.store","B":"Solo usecase se detecta como módulo, porque su nombre corresponde a una de las capas internas reconocidas por Modulith","C":"Ninguno es módulo hasta que su package-info.java declare @ApplicationModule con sus dependencias permitidas","D":"payments se detecta como módulo nuevo; orders.internal.usecase es un subpaquete interno del módulo orders"},"correcta":"D","explicacionCorrecta":"Por defecto, Spring Modulith detecta como módulos los paquetes hijos directos del paquete base de la aplicación. payments es hijo directo de com.example.store; usecase es un subpaquete de orders, y los subpaquetes de un módulo son internos salvo que se expongan explícitamente.","explicacionesDistractores":{"A":"Solo los hijos directos del paquete base son módulos; orders.internal.usecase está varios niveles por debajo y pertenece a orders.","B":"La detección se basa en ser hijo directo del paquete base, no en el nombre de las capas.","C":"La detección por defecto no requiere @ApplicationModule; esta anotación sirve para declarar las dependencias permitidas del módulo."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"Detección de módulos"},{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"API pública y subpaquetes internos"}]},{"id":"dws-04-6e5ad781","asignatura":"dws","tema":"dws-04","enunciado":"Un proyecto define con ArchUnit una regla que prohíbe a las clases que residen fuera de «..catalog..» depender de clases que residen en «..catalog.internal..». ¿Cuál de estas dependencias haría fallar el test al ejecutarlo?","opciones":{"A":"CatalogController, de catalog.internal.controller, que invoca a CatalogService, de catalog.internal.domain.","B":"CatalogModule, situado en el paquete raíz de catalog, que delega la operación en CatalogModuleImpl, de catalog.internal.application.","C":"Una clase del paquete orders que llama a CatalogModule y recibe un BookSummary del paquete catalog.dto.","D":"Una clase del paquete orders que usa directamente CatalogService, del subpaquete catalog.internal.domain, para consultar libros."},"correcta":"D","explicacionCorrecta":"La regla solo prohíbe que clases ajenas a catalog dependan de catalog.internal. Una clase de orders está fuera de catalog y CatalogService reside en catalog.internal.domain, así que ArchUnit detecta la dependencia y el test falla (aunque el código compile, porque estar en internal no hace inaccesible una clase pública).","explicacionesDistractores":{"A":"Ambas clases residen dentro de catalog; la regla solo restringe a las clases que están fuera de ese paquete.","B":"CatalogModule reside dentro de catalog, por lo que la regla no le impide depender de catalog.internal; en la wiki la API pública delega precisamente en CatalogModuleImpl.","C":"CatalogModule está en el paquete raíz de catalog y BookSummary en catalog.dto, ninguno en catalog.internal; es el uso de la API pública que la wiki presenta como correcto."},"dificultad":"media","tipo":"situacion-practica","wikiRef":[{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"2.1 Verificar los límites entre módulos"},{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"Diagrama: paquetes del módulo de catálogo"}]},{"id":"dws-04-a88ac141","asignatura":"dws","tema":"dws-04","enunciado":"En el módulo orders, Order guarda un identificador del usuario en lugar de una referencia a User. Sobre el tipo que puede tener ese identificador, ¿qué afirmación es INCORRECTA?","opciones":{"A":"Puede ser una clase de users.internal, siempre que represente solo el identificador y no el usuario completo.","B":"Puede ser un tipo definido localmente en el propio módulo orders, que actúa como consumidor.","C":"Puede ser un tipo incluido en un contrato público del módulo users, si se decide exponerlo.","D":"Puede ser UUID, como en el ejemplo, donde Order almacena userId y OrderDetail almacena productId."},"correcta":"A","explicacionCorrecta":"La afirmación incorrecta es la de usar una clase de users.internal: la wiki establece que el tipo del identificador tampoco debe importar clases de users.internal ni de catalog.internal, porque eso haría depender a orders de un paquete interno de otro módulo.","explicacionesDistractores":{"B":"Es correcta: la wiki admite un tipo definido localmente en el módulo consumidor.","C":"Es correcta: la wiki admite un tipo incluido en un contrato público, si se decide exponerlo.","D":"Es correcta: en el ejemplo se usa UUID (Order con userId: UUID y OrderDetail con productId: UUID)."},"dificultad":"media","tipo":"afirmaciones","wikiRef":[{"archivo":"wiki/dws/tema-04-monolito-modular/contenido.md","seccion":"4. Modelos privados y relaciones mediante identificadores"}]}]}</script>
<script>
// Puntuación del examen. Este fichero se incrusta tal cual en el HTML del examen
// (sin los `export`), así que no puede importar nada.
//
// Acierto +1, error -0,33, blanco 0. Nota = (puntuación / total) × 10, entre 0 y 10.

const PUNTOS = { acierto: 1, error: -0.33, blanco: 0 };

function redondear(x) {
  return Math.round(x * 100) / 100;
}

// preguntas: [{ id, asignatura, tema, correcta }]
// respuestas: { [preguntaId]: 'A' | 'B' | 'C' | 'D' | null }  (ausente o null = en blanco)
function calcularResultado(preguntas, respuestas) {
  let aciertos = 0;
  let errores = 0;
  let enBlanco = 0;
  const detalle = [];
  const erroresPorTema = {};
  for (const p of preguntas) {
    const seleccionada = respuestas[p.id] ?? null;
    let resultado;
    if (seleccionada === null) {
      resultado = 'blanco';
      enBlanco++;
    } else if (seleccionada === p.correcta) {
      resultado = 'acierto';
      aciertos++;
    } else {
      resultado = 'error';
      errores++;
      erroresPorTema[p.tema] = (erroresPorTema[p.tema] || 0) + 1;
    }
    detalle.push({ preguntaId: p.id, asignatura: p.asignatura, tema: p.tema, seleccionada, correcta: p.correcta, resultado });
  }
  const total = preguntas.length;
  // Aritmética entera en centésimas: con coma flotante, 6 aciertos y 6 errores (4,02 puntos,
  // nota 1,005) se redondearían a 1,00 en lugar de 1,01.
  const centesimas = aciertos * Math.round(PUNTOS.acierto * 100) + errores * Math.round(PUNTOS.error * 100);
  const puntuacion = centesimas / 100;
  const nota = total ? Math.min(10, Math.max(0, Math.round((centesimas * 10) / total) / 100)) : 0;
  return {
    total,
    aciertos,
    errores,
    enBlanco,
    puntuacion,
    nota,
    porcentajeAciertos: total ? redondear((aciertos / total) * 100) : 0,
    respuestas: detalle,
    preguntasFalladas: detalle.filter((d) => d.resultado === 'error').map((d) => d.preguntaId),
    temasConErrores: Object.entries(erroresPorTema).map(([tema, n]) => ({ tema, errores: n })),
  };
}

</script>
<script>
// Lógica del examen en modo estudio. Requiere `calcularResultado` (puntuacion.mjs,
// incrustado antes) y los datos en <script type="application/json" id="datos">.
(function () {
  'use strict';
  const DATOS = JSON.parse(document.getElementById('datos').textContent);
  const PREGUNTAS = DATOS.preguntas;
  const LETRAS = ['A', 'B', 'C', 'D'];
